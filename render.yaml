services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    healthCheckPath: /api/dashboard/summary
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
