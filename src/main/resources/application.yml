spring:
  application:
    name: expense-tracker
  datasource:
    url: jdbc:h2:file:./data/expense-tracker;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  error:
    include-message: never
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
